name: proxy_comet
# Environment for the COMET-based MT metrics (translation/evaluate_mt.py:
# BLEU, chrF++, ROUGE-L, METEOR, XCOMET, SSA-COMET).
channels:
  - conda-forge
  - defaults
dependencies:
  - pip
  - python=3.12
  - pip:
      # MT Metrics
      - unbabel-comet==2.2.7
      - sacrebleu==2.5.1
      - rouge-score==0.1.2
      - evaluate==0.4.6
      - transformers==4.57.3
      - torch==2.9.0

      # Data Processing
      - pandas==2.3.3
      - numpy<2.0.0

      # Utilities
      - tqdm==4.67.1
      - pyyaml==6.0.3
